name: Validate combined backend

on:
  push:
    branches:
      - combined-backend-preview
    paths:
      - combined-server.js
      - .github/workflows/validate-combined-backend.yml
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check combined-server.js
